<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>乗り換えRUSH｜答え合わせUX v2</title>
<style>
*{box-sizing:border-box}
:root{
  --ink:#17345f; --muted:#6f7f95; --bg:#eef7ff; --yellow:#ffd84c;
  --green:#33b54a; --teal:#13b9b2; --red:#ff5067; --blue:#1f6ed4;
}
body{
  margin:0;background:#eef4fb;color:var(--ink);
  font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Yu Gothic","Meiryo",sans-serif;
}
.app{max-width:920px;margin:0 auto;min-height:100vh;background:white;box-shadow:0 0 30px #0000000b}
.screen{display:none}.screen.active{display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 8px}
.logo{font-weight:1000;font-size:27px;letter-spacing:.02em}
.logo b{color:#ffb800;font-style:italic;text-shadow:0 2px 0 #e55}
.counter{font-weight:1000;background:#eaf4ff;padding:9px 14px;border-radius:999px;color:#17345f}
.quiz{padding:24px 22px 40px}
.pill{display:table;margin:10px auto 18px;background:#fff2a8;padding:8px 16px;border-radius:999px;font-weight:1000}
.routeQ{text-align:center;font-size:31px;font-weight:1000;margin:24px 0 28px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.answer{
  border:2px solid #e2e8f0;background:#fff;border-radius:18px;padding:17px 18px;
  font:inherit;font-size:17px;font-weight:1000;text-align:left;cursor:pointer;box-shadow:0 5px 0 #dfe5ec;
}
.answer:active{transform:translateY(3px);box-shadow:0 2px 0 #dfe5ec}
.answer span{display:inline-grid;place-items:center;width:31px;height:31px;border-radius:50%;background:#edf3fb;margin-right:10px}
.note{text-align:center;color:#91a0b3;font-size:12px;margin-top:18px}

/* Answer screen */
.answer-wrap{padding:8px 16px 26px}
.answer-title{
  width:min(520px,92%);margin:8px auto 16px;background:var(--ink);color:white;text-align:center;
  padding:11px 20px;border-radius:999px;font-size:21px;font-weight:1000;letter-spacing:.05em
}
.info-row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 10px 12px}
.info-chip{background:#fff;border:1px solid #dce9f7;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:1000;color:#53667d}
.stage{
  position:relative;height:390px;border-radius:28px;overflow:hidden;border:1px solid #cce7f7;
  background:linear-gradient(#cceeff 0 54%,#f5f8fa 54% 100%);
  box-shadow:inset 0 -16px 35px #d9edf855;
}
.skyline{
  position:absolute;left:0;right:0;bottom:115px;height:118px;opacity:.23;
  background:
    linear-gradient(90deg,
    #557594 0 5%,transparent 5% 7%,#6e8aa5 7% 12%,transparent 12% 14%,
    #557594 14% 21%,transparent 21% 24%,#7890a8 24% 31%,transparent 31% 34%,
    #557594 34% 42%,transparent 42% 45%,#6d859d 45% 52%,transparent 52% 56%,
    #557594 56% 65%,transparent 65% 69%,#7890a8 69% 78%,transparent 78% 82%,
    #557594 82% 93%,transparent 93%);
}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.65}
.c1{left:8%;top:50px;width:90px;height:26px}.c2{right:8%;top:78px;width:120px;height:30px}
.track{
  position:absolute;left:6%;right:6%;bottom:111px;height:8px;background:#66758b;border-radius:8px;z-index:2
}
.track:after{
  content:"";position:absolute;left:0;right:0;top:10px;height:4px;
  background:repeating-linear-gradient(90deg,#8693a3 0 17px,transparent 17px 28px)
}
.line-band{
  position:absolute;bottom:52px;height:38px;display:flex;align-items:center;justify-content:center;
  color:white;font-size:14px;font-weight:1000;letter-spacing:.03em;z-index:1
}
.line1{left:7%;width:43%;background:var(--green);border-radius:12px 0 0 12px}
.line2{left:50%;right:7%;background:var(--teal);border-radius:0 12px 12px 0}
.stations{position:absolute;left:6%;right:6%;bottom:83px;z-index:6;display:flex;justify-content:space-between}
.station{width:120px;text-align:center;transform:translateY(50%)}
.marker{width:27px;height:27px;background:white;border:7px solid var(--red);border-radius:50%;margin:0 auto 10px;box-shadow:0 0 0 4px #ffffffcc}
.station.mid .marker{border-color:#222}.station.goal .marker{border-color:var(--teal)}
.station-name{display:inline-block;background:white;border:2px solid #cbd9e8;border-radius:14px;padding:8px 12px;font-weight:1000;box-shadow:0 5px 0 #cbd9e8;white-space:nowrap}
.kana{display:block;color:#8897aa;font-size:10px;margin-top:2px}

/* Cute train */
.train{
  position:absolute;z-index:10;bottom:123px;left:calc(6% - 10px);width:106px;height:59px;
  transition:left .9s cubic-bezier(.35,.1,.18,1);
}
.train.moving{animation:bob .14s infinite alternate}
@keyframes bob{to{transform:translateY(-3px) rotate(-.5deg)}}
.car{
  position:absolute;left:18px;top:8px;width:79px;height:42px;background:#ff5c65;border:4px solid #17345f;
  border-radius:16px 20px 10px 10px;box-shadow:0 4px 0 #17345f;
}
.front{
  position:absolute;left:0;top:14px;width:35px;height:35px;background:#ff5c65;border:4px solid #17345f;border-radius:50% 38% 35% 45%;
}
.window{position:absolute;top:7px;width:18px;height:14px;background:#bdeaff;border:3px solid #17345f;border-radius:5px}
.w1{left:16px}.w2{left:40px}
.stripe{position:absolute;left:3px;right:3px;bottom:6px;height:6px;background:#ffd84c}
.wheel{position:absolute;bottom:-9px;width:16px;height:16px;background:#17345f;border-radius:50%}
.wh1{left:24px}.wh2{right:10px}
.face{position:absolute;left:7px;top:9px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #17345f}
.face:after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:#17345f;left:2px;top:2px}
.motion{position:absolute;left:-24px;top:24px;width:20px;height:3px;background:#5f7898;box-shadow:-6px -9px 0 #5f7898,-10px 9px 0 #5f7898;opacity:0}
.train.moving .motion{opacity:.75}

.speech{
  position:absolute;z-index:12;bottom:190px;background:white;border:3px solid #17345f;border-radius:18px;
  padding:8px 12px;font-size:13px;font-weight:1000;opacity:0;transform:translateX(-50%) scale(.65);transition:.2s
}
.speech.show{opacity:1;transform:translateX(-50%) scale(1)}
.sp1{left:7%}.sp2{left:50%}.sp3{left:93%}
.leg{
  position:absolute;bottom:22px;font-size:11px;font-weight:1000;color:white;z-index:3;
  background:#17345f;padding:5px 8px;border-radius:999px
}
.leg1{left:27%}.leg2{right:24%}

.result-panel{
  margin-top:16px;border-radius:26px;background:linear-gradient(#f7fbff,#edf6ff);padding:18px 14px 16px;text-align:center;
  border:1px solid #dbeaf7;min-height:198px
}
.result-big{font-size:47px;font-weight:1000;opacity:0;transform:scale(.55);transition:.28s}
.result-big.show{opacity:1;transform:scale(1)}
.result-big.ok{color:#ff4d62}.result-big.ng{color:#e13c46}
.route-summary{font-size:19px;font-weight:1000;margin:8px auto 10px;opacity:0;transition:.25s}
.route-summary.show{opacity:1}
.line-summary{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;opacity:0;transition:.25s}
.line-summary.show{opacity:1}
.line-tag{color:white;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:1000}
.tag1{background:var(--green)}.tag2{background:var(--teal)}
.result-sub{margin-top:10px;color:#65778d;font-size:13px;font-weight:900;opacity:0}.result-sub.show{opacity:1}
.actions{display:flex;justify-content:center;gap:10px;margin-top:14px}
.btn{border:0;border-radius:16px;padding:13px 20px;font:inherit;font-weight:1000;cursor:pointer}
.primary{background:var(--yellow);box-shadow:0 5px 0 #eabf24}.ghost{background:#eef2f6;color:#516276}
.btn:active{transform:translateY(3px)}

@media(max-width:640px){
 .topbar{padding:14px}.logo{font-size:22px}.quiz{padding:18px 14px 32px}.answers{grid-template-columns:1fr}
 .routeQ{font-size:25px}.answer-wrap{padding:6px 8px 20px}.answer-title{font-size:17px}
 .stage{height:350px}.station{width:83px}.station-name{padding:7px 8px;font-size:12px}
 .train{width:92px;transform-origin:center}.line-band{font-size:11px}.info-row{margin:0 2px 10px}
 .result-big{font-size:39px}.route-summary{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">乗り換え <b>RUSH</b></div>
    <div class="counter">1 / 5 問</div>
  </div>

  <section id="quiz" class="screen active quiz">
    <div class="pill">ベストな乗換駅はどこ？</div>
    <div class="routeQ">新宿 → 溝の口</div>
    <div class="answers">
      <button class="answer" onclick="answer('渋谷')"><span>A</span>渋谷</button>
      <button class="answer" onclick="answer('目黒')"><span>B</span>目黒</button>
      <button class="answer" onclick="answer('品川')"><span>C</span>品川</button>
      <button class="answer" onclick="answer('池袋')"><span>D</span>池袋</button>
    </div>
    <div class="note">このモックでは「渋谷」が正解です。正解・不正解の両方を試せます。</div>
  </section>

  <section id="answerScreen" class="screen answer-wrap">
    <div class="answer-title">🚃 答え合わせ中…</div>
    <div class="info-row">
      <div class="info-chip">電車がルートを走ります！</div>
      <div class="info-chip" id="chosenChip">選んだ乗換駅：渋谷</div>
    </div>

    <div class="stage">
      <div class="cloud c1"></div><div class="cloud c2"></div><div class="skyline"></div>
      <div class="track"></div>
      <div class="line-band line1">JR山手線</div>
      <div class="line-band line2">東急田園都市線</div>
      <div class="leg leg1">① 新宿 → 渋谷</div>
      <div class="leg leg2">② 渋谷 → 溝の口</div>

      <div class="speech sp1">新宿 発！</div>
      <div class="speech sp2">渋谷で乗換！</div>
      <div class="speech sp3">溝の口 到着！</div>

      <div id="train" class="train">
        <div class="motion"></div>
        <div class="front"><div class="face"></div></div>
        <div class="car">
          <div class="window w1"></div><div class="window w2"></div>
          <div class="stripe"></div>
          <div class="wheel wh1"></div><div class="wheel wh2"></div>
        </div>
      </div>

      <div class="stations">
        <div class="station">
          <div class="marker"></div>
          <div class="station-name">新宿<span class="kana">しんじゅく</span></div>
        </div>
        <div class="station mid">
          <div class="marker"></div>
          <div class="station-name">渋谷<span class="kana">しぶや</span></div>
        </div>
        <div class="station goal">
          <div class="marker"></div>
          <div class="station-name">溝の口<span class="kana">みぞのくち</span></div>
        </div>
      </div>
    </div>

    <div class="result-panel">
      <div id="resultBig" class="result-big"></div>
      <div id="routeSummary" class="route-summary">新宿 → 渋谷 → 溝の口</div>
      <div id="lineSummary" class="line-summary">
        <span class="line-tag tag1">JR山手線</span>
        <span class="line-tag tag2">東急田園都市線</span>
      </div>
      <div id="resultSub" class="result-sub"></div>
      <div class="actions">
        <button class="btn ghost" onclick="resetDemo()">もう一度試す</button>
        <button class="btn primary" onclick="resetDemo()">次の問題へ →</button>
      </div>
    </div>
  </section>
</div>

<script>
let timers=[],ctx=null;
const CORRECT="渋谷";
function show(id){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function audio(){
  if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==="suspended")ctx.resume();
  return ctx;
}
function tone(freq,d=.1,vol=.035,type="sine",delay=0){
  const c=audio(),t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);
}
function stationChime(){tone(520,.055,.022,"triangle");tone(700,.07,.022,"triangle",.06)}
function correctSE(){tone(660,.09,.045,"sine");tone(880,.14,.05,"sine",.09)}
function wrongSE(){tone(190,.18,.045,"sawtooth");tone(90,.30,.04,"sawtooth",.14)}

function answer(selected){
  audio();
  document.getElementById("chosenChip").textContent="選んだ乗換駅："+selected;
  show("answerScreen");

  const train=document.getElementById("train");
  const speeches=document.querySelectorAll(".speech");
  const big=document.getElementById("resultBig");
  const route=document.getElementById("routeSummary");
  const lines=document.getElementById("lineSummary");
  const sub=document.getElementById("resultSub");

  speeches.forEach(x=>x.classList.remove("show"));
  big.className="result-big"; route.classList.remove("show"); lines.classList.remove("show"); sub.classList.remove("show");
  train.style.transition="none"; train.style.left="calc(6% - 10px)"; train.classList.remove("moving");

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    speeches[0].classList.add("show");stationChime();

    later(()=>{
      train.style.transition="left .9s cubic-bezier(.35,.1,.18,1)";
      train.classList.add("moving");
      train.style.left="calc(50% - 52px)";
    },420);

    later(()=>{
      train.classList.remove("moving");
      speeches[1].classList.add("show");
      stationChime();
    },1350);

    later(()=>{
      train.classList.add("moving");
      train.style.left="calc(93% - 92px)";
    },1760);

    later(()=>{
      train.classList.remove("moving");
      speeches[2].classList.add("show");
      stationChime();
    },2710);

    later(()=>{
      const ok=selected===CORRECT;
      big.textContent=ok?"○ 正解！":"× 不正解";
      big.className="result-big "+(ok?"ok":"ng")+" show";
      route.classList.add("show");
      lines.classList.add("show");
      sub.textContent=ok
        ?"ピンポン♪　この乗り換えで到着！"
        :"ブブー！　正解の乗換駅は「渋谷」";
      sub.classList.add("show");
      ok?correctSE():wrongSE();
    },3000);
  }));
}

function resetDemo(){
  timers.forEach(clearTimeout);timers=[];
  show("quiz");
}
</script>
</body>
</html>
